# Overlay GPU — usa runtime nvidia (NVIDIA Container Toolkit no host).
# Evita o erro CDI "failed to discover GPU vendor" do Docker 25+ com `gpus: all`.
# Produção: deploy-ia.sh inclui este arquivo quando USE_GPU=1 (padrão).
# Após o up, deploy-ia.sh valida torch.cuda.is_available() no softmusic-worker.
services:
  python-ai:
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
  worker:
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
