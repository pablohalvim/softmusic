apiVersion: 1

providers:
  - name: SoftMusic
    orgId: 1
    folder: SoftMusic
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Mesmo path do bind mount em docker-compose (fora do named volume).
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
